<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Report</title>

    <link rel="stylesheet"
        href="style.css">


    <script src=
"https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js">
    </script>

</head>


<body>


<div class="layout">


    <aside class="sidebar">

        <h2 id="sidebarTitle"></h2>


        <button
            id="navHome"
            onclick="location.href='index.html'">
        </button>


        <button
            id="navDash"
            onclick="goDashboard()">
        </button>


        <button
            id="navReport"
            onclick="goReport()">
        </button>

    </aside>



    <main class="main">


        <div class="topbar">

            <button onclick="setLang('en')">
                EN
            </button>

            <button onclick="setLang('hi')">
                HI
            </button>

            <button onclick="setLang('mr')">
                MR
            </button>

            <button onclick="setLang('de')">
                DE
            </button>

        </div>



        <div class="content">

            <h1 id="title"></h1>


            <div
                id="report">
            </div>


            <button
                class="download-btn"
                onclick="downloadReport()">
                Download Report
            </button>

        </div>


    </main>


</div>



<script src="script.js"></script>


<script>

document.addEventListener(

    "DOMContentLoaded",

    ()=>{

        applyLang();

        renderReport();

    }

);

</script>


</body>
</html>
