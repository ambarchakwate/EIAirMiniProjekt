<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
        href="style.css">

    <script src=
"https://cdn.jsdelivr.net/npm/chart.js">
    </script>

</head>


<body>


<div class="layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <h2 id="sidebarTitle"></h2>


        <button
            id="navHome"
            onclick="location.href='index.html'">

            Home

        </button>



        <button
            id="navDash"
            onclick="goDashboard()">

            Dashboard

        </button>



        <button
            id="navReport"
            onclick="goReport()">

            Report

        </button>


    </aside>




    <!-- MAIN -->

    <main class="main">


        <!-- LANGUAGE -->

        <div class="topbar">

            <button
                onclick="setLang('en')">

                EN

            </button>


            <button
                onclick="setLang('hi')">

                HI

            </button>


            <button
                onclick="setLang('mr')">

                MR

            </button>


            <button
                onclick="setLang('de')">

                DE

            </button>

        </div>




        <!-- CONTENT -->

        <div class="content">


            <h1
                id="title">
            </h1>



            <canvas
                id="chart">
            </canvas>


        </div>


    </main>


</div>




<script src="script.js"></script>



<script>

document.addEventListener(

    "DOMContentLoaded",

    ()=>{

        applyLang();

        renderDashboard();

    }

);

</script>



</body>
</html>
