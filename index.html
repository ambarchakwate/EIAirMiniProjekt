<!DOCTYPE html>
<html>
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Air Quality</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


<div class="layout">


    <aside class="sidebar">

        <h2 id="sidebarTitle"></h2>

        <button id="navHome">
        </button>

        <button
            id="navDash"
            onclick="goDashboard()">
        </button>

        <button
            id="navReport"
            onclick="goReport()">
        </button>

    </aside>



    <main class="main">


        <div class="topbar">

            <button onclick="setLang('en')">
                EN
            </button>

            <button onclick="setLang('hi')">
                HI
            </button>

            <button onclick="setLang('mr')">
                MR
            </button>

            <button onclick="setLang('de')">
                DE
            </button>

        </div>



        <div class="content">


            <h1 id="title"></h1>



            <div
                style="
                position:relative;
                width:300px;
                margin:auto;">

                <input
                    id="city"
                    type="text">

                <div
                    id="suggestions"
                    class="suggestions-box">
                </div>

            </div>



            <div>

                <button id="searchBtn">
                </button>

                <button id="locBtn">
                </button>

            </div>



            <div id="result">
            </div>


        </div>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
